<!doctype html><html lang="ko"><meta charset="utf-8"><title>Code Mode 실습 기록 — 실제 Codex CLI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#18212d;font:18px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}header{height:76px;background:#102735;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 36px}.brand{font-size:25px;font-weight:750}header span{color:#89d8c6;font-size:15px}nav{padding:18px 32px;display:flex;gap:10px;border-bottom:1px solid #d5dfe6;background:white}button{font:inherit;border:1px solid #c6d4de;border-radius:8px;background:white;padding:10px 18px;cursor:pointer}button.active{background:#116b5c;color:white;border-color:#116b5c}main{max-width:1380px;margin:auto;padding:26px 40px}h1{font-size:33px;margin:6px 0 12px}h2{font-size:24px;color:#115e52}p{line-height:1.8}.eyebrow{font-size:15px;color:#476270}.tabs{display:flex;gap:8px;margin:22px 0}.panel{background:white;border:1px solid #d9e3e9;border-radius:16px;padding:28px 32px;min-height:450px;box-shadow:0 8px 32px #17304008}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:20px/1.7 ui-monospace,Menlo,monospace;margin:12px 0;color:#243d50}.prompt{font:22px/1.9 -apple-system,'Apple SD Gothic Neo',sans-serif;white-space:pre-wrap}.badge{display:inline-block;font-size:14px;background:#e0f4ef;color:#116b5c;border-radius:6px;padding:5px 9px;margin-right:8px}.notice{font-size:16px;color:#586b79}a{color:#0c7263}table{border-collapse:collapse;width:100%;font-size:18px;margin:18px 0}th,td{border:1px solid #d7e2e8;text-align:left;padding:12px;line-height:1.6}th{background:#eaf3f1}code{font-size:.9em;color:#0b6354}footer{font-size:14px;color:#61727b;margin:20px 0}.answer{font-size:21px;line-height:1.85}.answer p{margin:12px 0}.bar{height:8px;background:#1c8c77;border-radius:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#eef7f4;padding:22px;border-radius:12px}.card b{font-size:23px}.num{font-size:46px;font-weight:bold;color:#12725d}.kw{color:#8c3ac0}.fn{color:#0b7b89}.str{color:#926017}.help{border-left:4px solid #19826e;padding:10px 20px;background:#edf7f4}
.focus-line{background:#fff0a4;box-shadow:inset 5px 0 #d29400;padding-left:12px}.code-line{border-radius:3px;cursor:pointer}.stepbar{display:flex;gap:10px;margin:18px 0}.record-result{font-size:25px;line-height:1.8}.record-path{font-size:19px}

<header><div class="brand">CODE MODE <span>실전 사용법</span></div><span>강의용 뷰어 · 공식 Codex UI 아님 · 실제 CLI 실행 기록</span></header>
<nav id="nav"></nav><main><div class="eyebrow" id="label"></div><h1 id="title"></h1><div class="notice" id="notice"></div><div class="tabs" id="tabs"></div><section class="panel" id="content"></section><footer>실행 환경과 날짜에 따라 결과가 달라집니다. 합성 자료와 공개 실시간 조회를 구분합니다.</footer></main>
<script>
const lessons=[['start','시작하기'],['01_research','1 · 서비스 조사'],['02_reviews','2 · 리뷰 분석'],['03_weekly','3 · 주간 보고서'],['04_github','4 · GitHub'],['finish','다시 활용하기']];let cur='start',tab='overview';
const titles={start:'AI가 도구를 코드로 연결하면?', '01_research':'공식 도움말 3개를 한 번에 조사하기','02_reviews':'리뷰 125행에서 필요한 결과만 꺼내기','03_weekly':'회의록과 업무 목록을 정확하게 연결하기','04_github':'열린 PR 5개의 검토 현황 모으기',finish:'내 업무에 적용하는 네 가지 기준'};
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function md(s){let lines=s.split('\n'),out='',inTable=false;for(let line of lines){if(line.startsWith('|')){if(/^\|[\s:|\-]+$/.test(line))continue;if(!inTable){out+='<table>';inTable=true}out+='<tr>'+line.slice(1,-1).split('|').map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';continue;}if(inTable){out+='</table>';inTable=false}if(/^#+ /.test(line)){out+='<h2>'+inline(line.replace(/^#+ /,''))+'</h2>';continue}out+='<p>'+inline(line)+'</p>'}return out+(inTable?'</table>':'')}
function inline(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')}
function syntax(s){return esc(s).replace(/\b(const|let|await|return|for|if|try|catch)\b/g,'<span class="kw">$1</span>').replace(/\b(Promise|JSON|Map|Set|text|allSettled|all|parse|stringify)\b/g,'<span class="fn">$1</span>')}
const start={overview:`<div class="grid"><div class="card"><b>조사</b><p>독립적인 조회를 묶고<br>근거가 있는 비교표 만들기</p></div><div class="card"><b>분석</b><p>큰 응답을 처리하고<br>필요한 숫자와 원문만 남기기</p></div><div class="card"><b>업무</b><p>공통 ID로 데이터를 연결하고<br>빠진 일과 기한 찾아내기</p></div><div class="card"><b>개발</b><p>목록에서 상세 조회로 이어가며<br>실패와 미확인을 구분하기</p></div></div><p class="help">같은 업무도 할 수 있습니다. 달라지는 것은 도구 호출과 중간 데이터의 처리 방식입니다.</p>`,concept:`<h2>직접 도구 호출</h2><pre>모델 → 조회 A → 모델 → 조회 B → 모델 → 결과 정리</pre><h2>Code Mode</h2><pre>모델 → JavaScript 실행\n         ├ 조회 A ─┐\n         └ 조회 B ─┴ 필터 · 집계 → 모델 → 답변</pre><p>실제 API 호출은 남아 있습니다. 모델이 중간 결과를 읽는 횟수와 양을 줄일 여지가 생깁니다.</p>`,setup:`<span class="badge">촬영 검증: codex-cli 0.146.0</span><h2>새 실행에서 기능을 요청하기</h2><pre>codex --enable code_mode</pre><h2>지속 설정을 사용할 때</h2><pre>[features.code_mode]\nenabled = true</pre><p>개발 중 기능입니다. 설정값만으로 적용을 단정하지 않고 실제 exec 실행 기록을 확인합니다.</p><p>이 강의의 MCP 도구와 데이터는 실습 자료에 포함됩니다. 개인 설정을 덮어쓰지 않습니다.</p><a href="https://learn.chatgpt.com/docs/config-file/config-reference" target="_blank">공식 설정 문서</a>`,proof:`<h2>실제 Code Mode 사전 확인</h2><pre id="proof">불러오는 중</pre><p>위 코드는 Codex가 실제 생성한 exec 입력입니다. 강사가 결과를 대신 계산한 화면이 아닙니다.</p>`};
const finish={overview:`<h2>이런 구간에 적용하세요</h2><p>① 서로 독립적인 조회가 여러 개 있다.</p><p>② 도구 응답이 크지만 필요한 필드는 적다.</p><p>③ 공통 ID로 서로 다른 자료를 연결한다.</p><p>④ 목록을 얻은 뒤 항목별 작업을 반복한다.</p><h2>따로 판단할 구간</h2><p>사람의 승인 · 오래 기다리는 작업 · 출처의 의미 판단 · 결과 검증</p>`,prompt:`<div class="prompt">[입력]을 읽어 [결과물]을 만들어줘.\n독립적인 조회는 가능한 실행 환경에서 묶어줘.\n[고유 ID]로 중복을 제거하거나 자료를 연결해줘.\n중간 원본 전체 대신 [필요한 필드]를 남겨줘.\n조회 실패 · 값 없음 · 해당 없음은 구분해줘.\n결론을 확인할 원문 링크나 ID를 보존해줘.</div>`,limits:`<h2>숫자를 읽을 때 주의할 점</h2><p>도구 설명량 감소 ≠ 전체 요금 감소</p><p>exec 1회 ≠ API 호출 1회</p><p>파일 분석 성공 ≠ Code Mode가 사용됐다는 증거</p><p>짧은 조회를 묶기 ≠ 긴 작업을 계속 기다리기</p><h2>확인한 실제 실패 보고</h2><p>Codex 이슈 #29122: 사람의 답변을 기다리는 MCP 호출을 모델이 중간에 종료한 사용자 보고.</p><a href="https://github.com/openai/codex/issues/29122" target="_blank">버전과 재현 기록 확인</a>`,homework:`<h2>한 가지 조건만 바꿔 다시 실행해보세요</h2><p>조사: 비교 항목을 하나 추가하기</p><p>리뷰: 낮은 평점 기준을 2점에서 3점으로 바꾸기</p><p>주간 보고서: 기준일을 바꾸기</p><p>GitHub: 조회 개수를 바꾸기</p><p class="help">결과가 달라진 이유를 원문과 숫자로 설명할 수 있으면 실습 성공입니다.</p>`};
async function show(id,part){cur=id;tab=part||'overview';history.replaceState(null,'','#'+cur+'/'+tab);document.querySelector('#nav').innerHTML=lessons.map(([k,v])=>`<button class="${k===cur?'active':''}" onclick="show('${k}')">${v}</button>`).join('');title.textContent=titles[cur];label.textContent=cur==='start'||cur==='finish'?'사용법과 판단 기준':'실제 실행 기록 · 입력 → 실행 코드 → 결과 → 검증';notice.textContent=['02_reviews','03_weekly'].includes(cur)?'강의용 합성 데이터 · 실제 고객이나 직원 정보가 아닙니다.':cur.startsWith('0')?'공개 자료 조회 · 결과는 녹화 시점의 기록입니다.':'실습 자료와 재현 명령을 함께 제공합니다.';
let opts=(cur==='start'?[['overview','오늘 만들 결과'],['concept','작동 원리'],['setup','사용 환경'],['records','기록 보는 법'],['proof','실행 확인']]:cur==='finish'?[['overview','적용 기준'],['prompt','재사용 프롬프트'],['limits','한계와 비교'],['homework','따라 하기 과제']]:[['overview','입력 프롬프트'],['data','입력 자료'],['code','실제 실행 코드'],['result','결과'],['check','검증']]);tabs.innerHTML=opts.map(([k,v])=>`<button class="${k===tab?'active':''}" onclick="show('${cur}','${k}')">${v}</button>`).join('');
if(cur==='start'||cur==='finish'){content.innerHTML=(cur==='start'?start:finish)[tab];if(tab==='proof'){await showProof('request')}window.scrollTo(0,0);return}
let d=await fetch('/assets/'+cur+'.json').then(r=>r.json());
if(tab==='overview')content.innerHTML='<span class="badge">복사해서 조건을 바꿔보세요</span><div class="prompt">'+esc(d.prompt)+'</div><p><button onclick="runLive()">이 프롬프트로 Codex 실제 실행</button></p><div id="live" class="notice"></div>';
if(tab==='code')content.innerHTML='<span class="badge">Codex가 실제 생성한 JavaScript</span>'+d.events.filter(x=>x.type==='code').map((x,i)=>'<h2>exec '+(i+1)+'</h2><pre>'+x.code.split('\n').map(line=>'<div class="code-line" onclick="focusCode(this)">'+syntax(line||' ')+'</div>').join('')+'</pre>').join('');
if(tab==='result')content.innerHTML='<span class="badge">실제 최종 답변</span><div class="answer">'+md(d.answer)+'</div>';
if(tab==='check'){let q=await fetch('/qa/independent-checks.json').then(r=>r.json());content.innerHTML='<h2>결과와 원본을 대조합니다</h2><pre>'+esc(JSON.stringify(q[cur],null,2))+'</pre><p>실행 코드 존재와 결과 정확성을 따로 확인했습니다. 속도·비용 우월성은 측정하지 않았습니다.</p>'}
if(tab==='data'){let names=cur==='02_reviews'?['reviews-06','reviews-07','reviews-08']:cur==='03_weekly'?['tasks','minutes']:[]; if(names.length){let a=await Promise.all(names.map(n=>fetch('/course/data/'+n+'.json').then(r=>r.json()).then(v=>({name:n+'.json',rows:v.length,preview:v.slice(0,6)}))));content.innerHTML=a.map(v=>'<h2>'+v.name+' · '+v.rows+'행</h2><pre>'+esc(JSON.stringify(v.preview,null,2))+'</pre>').join('')}else content.innerHTML=cur==='01_research'?'<h2>공식 도움말</h2><p>Tally — https://tally.so/help</p><p>Typeform — https://www.typeform.com/help</p><p>Google Forms — support.google.com/docs</p><p>제공된 페이지에서 확인하지 못한 기능은 미확인으로 표시합니다.</p>':'<h2>공개 GitHub 데이터</h2><p>저장소: astral-sh/ruff</p><p>열린 PR 5개 → PR별 상세와 리뷰 기록</p><p>이 도구는 CI 검사 결과를 제공하지 않습니다.</p>'}
window.scrollTo(0,0)
}
async function runLive(){let id=cur;const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson:id})});if(!r.ok){document.querySelector('#live').textContent='다른 실행이 진행 중입니다.';return}let started=Date.now();let poll=setInterval(async()=>{let s=await fetch('/api/status').then(r=>r.json());let el=document.querySelector('#live');if(el)el.textContent='실제 Codex CLI 실행 중 · '+Math.round((Date.now()-started)/1000)+'초 · 결과를 기다리는 중';if(!s.running){clearInterval(poll);if(el)el.textContent=s.exit===0?'실행 완료 · 실제 실행 코드와 결과 탭에서 확인하세요.':'실행 실패 · 기록을 확인하세요.'}},1000)}

start.records=`<h2>실행 기록 = 작업 중 남은 이력</h2><p>무엇을 요청했는지, 어떤 도구를 어떤 코드로 불렀는지,<br>도구가 무엇을 돌려줬는지를 확인하는 자료입니다.</p><div class="help"><b>코드를 읽는 것은 선택 사항이에요.</b><br>먼저 요청과 결과를 확인하고, 처리 방식이 궁금할 때 코드를 열어보세요.</div><h2>이 강의에서는 어디서 보나요?</h2><p>① <b>시작하기 → 실행 확인</b>: 사전 확인의 요청·코드·결과<br>② <b>각 실습 → 실제 실행 코드</b>: 해당 실습에서 생성된 코드</p><p class="record-path">파일로 보기: 실습 자료의 <a href="/assets/preflight-record.json" target="_blank">assets/preflight-record.json</a><br>리뷰 예제: <a href="/assets/02_reviews.json" target="_blank">assets/02_reviews.json</a></p><details><summary>심화: 원본 기록은 어디 있나요?</summary><p>이번 촬영의 CLI 세션은 사용자 폴더의 <code>~/.codex/sessions/날짜/rollout-….jsonl</code>에 저장됐습니다. JSONL은 사건을 한 줄씩 기록한 텍스트 형식입니다. 앱·설정에 따라 저장 위치나 화면 노출은 다를 수 있습니다.</p><p>이 뷰어는 이번 작업의 도구 호출과 결과만 발췌해 보여줍니다. 원본 세션 전체에는 개인 대화와 다른 정보가 포함될 수 있어 실습 자료에 넣지 않았습니다.</p></details>`;
start.proof='<div id="proof-body"></div>';
let proofRecord;
async function showProof(step){
 proofRecord=await fetch('/assets/preflight-record.json').then(r=>r.json());const d=proofRecord;
 const bar='<div class="stepbar">'+[['request','1 · 요청'],['code','2 · 실제 코드'],['result','3 · 반환 결과']].map(([k,n])=>'<button class="'+(k===step?'active':'')+'" onclick="showProof(\''+k+'\')">'+n+'</button>').join('')+'</div>';
 let body='';
 if(step==='request')body='<h2>복잡한 실습 전에, 작은 작업부터 확인했어요</h2><div class="prompt">'+esc(d.request_ko)+'</div><p class="help">파일을 수정하지 않는 두 조회입니다.<br><b>현재 폴더</b>와 <b>올해 연도</b>가 실제로 반환되는지 확인했습니다.</p><p>2026-09-13 미국 동부 시간에 실행한 기록입니다.</p>';
 if(step==='code')body='<h2>코덱스가 실제 만든 실행 코드</h2><p>문법보다 <b>두 작업을 묶어 실행하고 결과를 보여준다</b>는 흐름을 보세요.</p><div class="stepbar"><button onclick="focusProof(0)">두 조회를 묶기</button><button onclick="focusProof(1)">폴더와 연도 조회</button><button onclick="focusProof(2)">결과 꺼내기</button></div><pre id="proof-code">'+d.code.split('\n').map((line,i)=>'<div class="code-line" data-line="'+i+'" onclick="focusCode(this)">'+syntax(line||' ')+'</div>').join('')+'</pre>';
 if(step==='result')body='<h2>같은 실행 호출에서 돌아온 결과</h2><div class="record-result"><b>현재 폴더</b><pre>'+esc(d.checks.directory_result)+'</pre><b>올해 연도</b><pre>'+esc(d.checks.year_result)+'</pre></div><p class="help">실제 exec 입력과 그 호출의 반환값을 대조했습니다.<br>이 화면은 Code Mode 실행을 확인한 것이며, 속도 비교 실험은 아닙니다.</p><a href="/assets/preflight-record.json" target="_blank">이 요청·코드·결과를 파일로 열기</a>';
 document.querySelector('#proof-body').innerHTML='<span class="badge">강의용 뷰어 · 원본 세션의 해당 호출 발췌</span>'+bar+body+'<p class="notice">공개 배포본: 로컬 절대 경로만 /path/to/codemode_lecture로 치환했습니다.</p>';
}
function focusCode(el){document.querySelectorAll('.focus-line').forEach(x=>x.classList.remove('focus-line'));el.classList.add('focus-line')}
function focusProof(part){document.querySelectorAll('.focus-line').forEach(x=>x.classList.remove('focus-line'));const groups=[[0],[1,2],[4]];for(const n of groups[part])document.querySelector('#proof-code [data-line="'+n+'"]').classList.add('focus-line')}

let [a,b]=location.hash.slice(1).split('/');show(a||'start',b);
</script></html>
